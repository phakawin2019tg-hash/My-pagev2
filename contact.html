<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Khawpun Space</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Animation กล้วยและช็อกโกแลตโปรยลงมา -->
    <div class="falling-container">
        <span class="falling-item" style="left: 10%; animation-duration: 8s;">🍫</span>
        <span class="falling-item" style="left: 30%; animation-duration: 6s;">🍌</span>
        <span class="falling-item" style="left: 50%; animation-duration: 9s;">🍫</span>
        <span class="falling-item" style="left: 70%; animation-duration: 7s;">🍌</span>
        <span class="falling-item" style="left: 90%; animation-duration: 8.5s;">🍫</span>
    </div>

    <nav class="navbar">
        <div class="nav-brand">Khawpun Space ✨</div>
        <div class="nav-links">
            <a href="index.html">← 돌아กลับหน้าหลัก (Home)</a>
        </div>
    </nav>

    <div class="container" style="max-width: 600px;">
        <section class="card">
            <h2>📬 ติดต่อเรา (Contact Us)</h2>
            <p>กรอกข้อมูลด้านล่างเพื่อส่งข้อความถึงเรา:</p>

            <form action="#" method="POST">
                <div class="form-group">
                    <label for="fullname">ชื่อ-นามสกุล</label>
                    <input type="text" id="fullname" name="fullname" placeholder="กรอกชื่อของคุณ" required>
                </div>

                <div class="form-group">
                    <label for="email">อีเมล</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="message">ข้อความ</label>
                    <textarea id="message" name="message" rows="5" placeholder="พิมพ์ข้อความที่ต้องการติดต่อ..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">ส่งข้อความ ✨</button>
            </form>
        </section>
    </div>

    <footer class="site-footer">
        <p>© Khawpun Profile | <a href="index.html">กลับหน้าหลัก</a></p>
    </footer>

</body>
</html>
